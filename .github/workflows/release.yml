name: Build & Release APK

on:
  push:
    tags: ["v*"]        # e.g. git tag v1.0 && git push --tags
  workflow_dispatch:     # manual run from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Installs Gradle 8.7 directly, so no gradlew/wrapper jar is needed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk IosFacebook-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IosFacebook-apk
          path: IosFacebook-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: IosFacebook-*.apk
          generate_release_notes: true
